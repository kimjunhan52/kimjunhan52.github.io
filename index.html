<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Online PDF Viewer</title>

  <!-- External CDNs for Libraries -->
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind CSS for utility styling base -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --sidebar-width: 260px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-card);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Glassmorphism & Elevation Elements */
    .glass-panel {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .thumbnail-card {
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .thumbnail-card:hover {
      border-color: var(--text-muted);
    }
    .thumbnail-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    /* Viewer Container Canvas Rendering */
    .pdf-page-container {
      position: relative;
      margin: 16px auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      background-color: #ffffff;
      border-radius: 4px;
      transition: transform 0.2s ease;
    }

    /* Text Layer overlay for selection & search highlight */
    .textLayer {
      position: absolute;
      text-align: initial;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.25;
      line-height: 1;
      pointer-events: auto;
    }
    .textLayer ::selection {
      background: #2563eb;
      color: transparent;
    }
    .textLayer .highlight {
      background-color: rgba(255, 226, 0, 0.8);
      border-radius: 2px;
    }

    /* Loading Spinner */
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top: 3px solid var(--accent);
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Drag Overlay Active State */
    .drag-over {
      border-color: var(--accent) !important;
      background-color: rgba(59, 130, 246, 0.1) !important;
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none">

  <header class="glass-panel h-16 flex items-center justify-between px-4 z-20 shrink-0">
    <!-- Left Section: Logo & Sidebar Toggle -->
    <div class="flex items-center gap-3">
      <button id="toggleSidebarBtn" title="Toggle Sidebar" class="p-2 rounded-lg hover:bg-slate-700 text-slate-300 transition">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-file-pdf text-red-500 text-2xl"></i>
        <span class="font-semibold text-lg tracking-wide hidden sm:inline">PDF Workspace</span>
      </div>
    </div>

    <!-- Center Section: Navigation & Zoom Toolbar -->
    <div id="viewerControls" class="hidden flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
      <!-- Page Navigation -->
      <button id="prevPageBtn" title="Previous Page" class="p-1.5 rounded-md hover:bg-slate-700 text-slate-300 disabled:opacity-40">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="flex items-center gap-1 text-sm text-slate-300">
        <input type="number" id="pageNumberInput" min="1" class="w-12 text-center bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-white focus:outline-none focus:border-blue-500">
        <span class="text-slate-400">/ <span id="totalPagesCount">0</span></span>
      </div>
      <button id="nextPageBtn" title="Next Page" class="p-1.5 rounded-md hover:bg-slate-700 text-slate-300 disabled:opacity-40">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <div class="h-4 w-px bg-slate-700 mx-1"></div>

      <!-- Zoom Controls -->
      <button id="zoomOutBtn" title="Zoom Out" class="p-1.5 rounded-md hover:bg-slate-700 text-slate-300">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <select id="zoomSelect" class="bg-slate-900 border border-slate-700 text-xs rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-blue-500">
        <option value="auto">Auto Fit</option>
        <option value="page-width">Fit Width</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1.0" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2.0">200%</option>
      </select>
      <button id="zoomInBtn" title="Zoom In" class="p-1.5 rounded-md hover:bg-slate-700 text-slate-300">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>

      <div class="h-4 w-px bg-slate-700 mx-1 hidden md:block"></div>

      <!-- Rotation & View Mode -->
      <button id="rotateBtn" title="Rotate Clockwise" class="p-1.5 rounded-md hover:bg-slate-700 text-slate-300 hidden md:block">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button id="viewModeBtn" title="Toggle Continuous Scroll / Single Page" class="p-1.5 rounded-md hover:bg-slate-700 text-slate-300 hidden md:block">
        <i class="fa-solid fa-scroll"></i>
      </button>
    </div>

    <!-- Right Section: Actions & File Operations -->
    <div class="flex items-center gap-2">
      <!-- Search Input Toggle -->
      <div class="relative hidden sm:block">
        <input type="text" id="searchInput" placeholder="Search in text..." class="w-36 md:w-48 bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>
      </div>

      <!-- Upload Button -->
      <label for="fileInput" class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-medium px-3 py-1.5 rounded-lg flex items-center gap-2 transition shadow-md shadow-blue-600/30">
        <i class="fa-solid fa-folder-open"></i>
        <span class="hidden sm:inline">Open File</span>
      </label>
      <input type="file" id="fileInput" accept="application/pdf" class="hidden">

      <!-- Download PDF -->
      <button id="downloadBtn" title="Download File" class="hidden p-2 rounded-lg hover:bg-slate-700 text-slate-300 transition">
        <i class="fa-solid fa-download"></i>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar / Thumbnail Navigation -->
    <aside id="sidebar" class="w-64 bg-slate-900/90 border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 z-10">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between text-slate-400 text-xs font-semibold uppercase tracking-wider">
        <span>Page Thumbnails</span>
        <span id="thumbnailCount" class="bg-slate-800 px-2 py-0.5 rounded-full text-slate-300">0</span>
      </div>
      <div id="thumbnailsContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Thumbnails rendered dynamically here -->
        <div class="text-center text-slate-500 text-xs mt-10">No document loaded</div>
      </div>
    </aside>

    <!-- Main PDF Viewer Container -->
    <main id="viewerWrapper" class="flex-1 bg-slate-950 overflow-auto relative flex flex-col items-center">
      
      <!-- Empty State Banner -->
      <div id="emptyState" class="my-auto p-8 max-w-md text-center flex flex-col items-center border-2 border-dashed border-slate-700 rounded-2xl bg-slate-900/50 transition-all">
        <div class="w-20 h-20 bg-blue-600/10 rounded-full flex items-center justify-center text-blue-500 mb-4 text-3xl">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-200 mb-2">Upload or Drag PDF Here</h3>
        <p class="text-slate-400 text-sm mb-6">Select a local PDF file to preview, navigate, zoom, and inspect content smoothly online.</p>
        <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-blue-500/20">
          Browse Computer
        </button>
      </div>

      <!-- PDF Canvas Viewport Container -->
      <div id="pdfContainer" class="w-full flex-1 py-6 px-4 hidden">
        <!-- Dynamically rendered pages / canvases -->
      </div>

      <!-- Loading overlay -->
      <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/70 backdrop-blur-sm flex flex-col items-center justify-center z-30">
        <div class="spinner mb-3"></div>
        <div id="loadingText" class="text-sm font-medium text-slate-300">Loading Document...</div>
      </div>
    </main>
  </div>

  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Application State Variables
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.0;
    let rotation = 0;
    let isContinuous = true; // true = scroll view, false = single page view
    let currentFile = null;
    let pdfDataArrayBuffer = null;

    // DOM Elements
    const fileInput = document.getElementById('fileInput');
    const emptyState = document.getElementById('emptyState');
    const pdfContainer = document.getElementById('pdfContainer');
    const viewerControls = document.getElementById('viewerControls');
    const pageNumberInput = document.getElementById('pageNumberInput');
    const totalPagesCount = document.getElementById('totalPagesCount');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomSelect = document.getElementById('zoomSelect');
    const rotateBtn = document.getElementById('rotateBtn');
    const viewModeBtn = document.getElementById('viewModeBtn');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const thumbnailsContainer = document.getElementById('thumbnailsContainer');
    const thumbnailCount = document.getElementById('thumbnailCount');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const downloadBtn = document.getElementById('downloadBtn');
    const searchInput = document.getElementById('searchInput');
    const viewerWrapper = document.getElementById('viewerWrapper');

    // --- EVENT LISTENERS ---

    fileInput.addEventListener('change', handleFileSelect);

    // Drag and Drop Handling
    ['dragenter', 'dragover'].forEach(eventName => {
      viewerWrapper.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        emptyState.classList.add('drag-over');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      viewerWrapper.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        emptyState.classList.remove('drag-over');
      }, false);
    });

    viewerWrapper.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0 && files[0].type === 'application/pdf') {
        loadPDFFile(files[0]);
      }
    });

    // Navigation Controls
    prevPageBtn.addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      updateActivePage();
    });

    nextPageBtn.addEventListener('click', () => {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      updateActivePage();
    });

    pageNumberInput.addEventListener('change', (e) => {
      const val = parseInt(e.target.value);
      if (val >= 1 && val <= pdfDoc.numPages) {
        pageNum = val;
        updateActivePage();
      } else {
        e.target.value = pageNum;
      }
    });

    // Zoom Controls
    zoomInBtn.addEventListener('click', () => {
      scale = Math.min(scale + 0.25, 3.0);
      zoomSelect.value = scale.toString();
      renderAllPages();
    });

    zoomOutBtn.addEventListener('click', () => {
      scale = Math.max(scale - 0.25, 0.5);
      zoomSelect.value = scale.toString();
      renderAllPages();
    });

    zoomSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'auto' || val === 'page-width') {
        calculateAutoFitScale(val);
      } else {
        scale = parseFloat(val);
      }
      renderAllPages();
    });

    // Rotation Control
    rotateBtn.addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      renderAllPages();
    });

    // View Mode Switcher
    viewModeBtn.addEventListener('click', () => {
      isContinuous = !isContinuous;
      viewModeBtn.innerHTML = isContinuous ? 
        '<i class="fa-solid fa-scroll"></i>' : 
        '<i class="fa-solid fa-file"></i>';
      renderAllPages();
    });

    // Sidebar Toggle
    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-ml-64');
    });

    // Download File
    downloadBtn.addEventListener('click', () => {
      if (!currentFile) return;
      const url = URL.createObjectURL(currentFile);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFile.name || 'document.pdf';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Text Search Functionality
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        performSearch(searchInput.value.trim());
      }
    });

    // --- PDF CORE FUNCTIONS ---

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        loadPDFFile(file);
      }
    }

    function showLoading(show, text = 'Loading Document...') {
      loadingText.textContent = text;
      loadingOverlay.classList.toggle('hidden', !show);
    }

    function loadPDFFile(file) {
      currentFile = file;
      showLoading(true, 'Reading File...');

      const fileReader = new FileReader();
      fileReader.onload = function () {
        pdfDataArrayBuffer = this.result;
        const typedarray = new Uint8Array(pdfDataArrayBuffer);

        pdfjsLib.getDocument(typedarray).promise.then((pdf) => {
          pdfDoc = pdf;
          pageNum = 1;
          totalPagesCount.textContent = pdf.numPages;
          thumbnailCount.textContent = pdf.numPages;
          pageNumberInput.value = 1;
          
          // Show UI Controls
          emptyState.classList.add('hidden');
          pdfContainer.classList.remove('hidden');
          viewerControls.classList.remove('hidden');
          viewerControls.classList.add('flex');
          downloadBtn.classList.remove('hidden');

          // Build Page Thumbnails and Render Pages
          generateThumbnails();
          renderAllPages();
          showLoading(false);
        }).catch(err => {
          console.error("PDF Loading Error: ", err);
          showLoading(false);
          alert("Error loading PDF document: " + err.message);
        });
      };
      fileReader.readAsArrayBuffer(file);
    }

    function calculateAutoFitScale(mode) {
      if (!pdfDoc) return;
      pdfDoc.getPage(1).then(page => {
        const viewport = page.getViewport({ scale: 1.0 });
        const containerWidth = viewerWrapper.clientWidth - 48;
        if (mode === 'page-width') {
          scale = containerWidth / viewport.width;
        } else {
          // Auto fit logic
          scale = Math.min(containerWidth / viewport.width, 1.2);
        }
      });
    }

    async function renderAllPages() {
      if (!pdfDoc) return;
      pdfContainer.innerHTML = ''; // Clear container

      const pagesToRender = isContinuous ? pdfDoc.numPages : 1;

      for (let i = 1; i <= pagesToRender; i++) {
        const targetPage = isContinuous ? i : pageNum;
        await renderSinglePageCanvas(targetPage);
        if (!isContinuous) break;
      }

      updateActivePageUI();
    }

    async function renderSinglePageCanvas(pageNo) {
      const page = await pdfDoc.getPage(pageNo);
      
      const viewport = page.getViewport({ scale: scale, rotation: rotation });

      // Create Page Card Wrapper
      const pageWrapper = document.createElement('div');
      pageWrapper.className = 'pdf-page-container';
      pageWrapper.id = `page-container-${pageNo}`;
      pageWrapper.style.width = `${viewport.width}px`;
      pageWrapper.style.height = `${viewport.height}px`;

      // Create Canvas
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      pageWrapper.appendChild(canvas);

      // Create Text Layer Overlay
      const textLayerDiv = document.createElement('div');
      textLayerDiv.className = 'textLayer';
      pageWrapper.appendChild(textLayerDiv);

      pdfContainer.appendChild(pageWrapper);

      // Render Canvas Context
      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };

      await page.render(renderContext).promise;

      // Render Text Layer for Text Selection
      page.getTextContent().then(textContent => {
        pdfjsLib.renderTextLayer({
          textContent: textContent,
          container: textLayerDiv,
          viewport: viewport,
          textDivs: []
        });
      });
    }

    async function generateThumbnails() {
      thumbnailsContainer.innerHTML = '';

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 0.2 });

        const thumbWrapper = document.createElement('div');
        thumbWrapper.className = `thumbnail-card p-2 bg-slate-800 rounded-lg cursor-pointer flex flex-col items-center gap-1 ${i === pageNum ? 'active' : ''}`;
        thumbWrapper.dataset.page = i;

        const canvas = document.createElement('canvas');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.className = 'rounded border border-slate-700 bg-white';

        const ctx = canvas.getContext('2d');
        page.render({ canvasContext: ctx, viewport: viewport });

        const label = document.createElement('span');
        label.className = 'text-xs text-slate-400 font-medium';
        label.textContent = `Page ${i}`;

        thumbWrapper.appendChild(canvas);
        thumbWrapper.appendChild(label);

        thumbWrapper.addEventListener('click', () => {
          pageNum = i;
          updateActivePage();
        });

        thumbnailsContainer.appendChild(thumbWrapper);
      }
    }

    function updateActivePage() {
      pageNumberInput.value = pageNum;
      if (!isContinuous) {
        renderAllPages();
      } else {
        const el = document.getElementById(`page-container-${pageNum}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
      updateActivePageUI();
    }

    function updateActivePageUI() {
      // Highlight sidebar active thumbnail
      document.querySelectorAll('.thumbnail-card').forEach((card) => {
        const page = parseInt(card.dataset.page);
        if (page === pageNum) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('active');
        }
      });

      // Enable/Disable Nav Buttons
      prevPageBtn.disabled = pageNum <= 1;
      nextPageBtn.disabled = pdfDoc && pageNum >= pdfDoc.numPages;
    }

    // --- TEXT SEARCH HIGHLIGHTING ---
    async function performSearch(query) {
      if (!query || !pdfDoc) return;
      showLoading(true, 'Searching document...');

      let matchFound = false;

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const textContent = await page.getTextContent();
        const text = textContent.items.map(item => item.str).join(' ');

        if (text.toLowerCase().includes(query.toLowerCase())) {
          pageNum = i;
          updateActivePage();
          matchFound = true;
          break;
        }
      }

      showLoading(false);
      if (!matchFound) {
        alert(`No matches found for "${query}"`);
      }
    }

    // Scroll Detection for Updating Current Page Number in Continuous Scroll Mode
    viewerWrapper.addEventListener('scroll', () => {
      if (!isContinuous || !pdfDoc) return;

      const pageContainers = document.querySelectorAll('.pdf-page-container');
      pageContainers.forEach((container) => {
        const rect = container.getBoundingClientRect();
        if (rect.top >= 0 && rect.top <= window.innerHeight / 2) {
          const id = container.id.replace('page-container-', '');
          const pageVal = parseInt(id);
          if (pageVal && pageVal !== pageNum) {
            pageNum = pageVal;
            pageNumberInput.value = pageNum;
            updateActivePageUI();
          }
        }
      });
    });
  </script>
</body>
</html>
